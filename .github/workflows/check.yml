name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check marketplace, plugin and agents
        run: python tools/check_plugin.py
      - name: Hook compiles
        run: python -m py_compile plugins/bakery-team/hooks/ownership.py plugins/bakery-team/hooks/ownership_lib.py plugins/bakery-team/hooks/repo_watch.py
